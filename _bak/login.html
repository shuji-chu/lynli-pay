<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商户登录 - 晴天支付</title><link rel="stylesheet" href="assets/style.css">
  <script src="assets/api.js"></script>
</head>
<body>
  <div class="header">
    <div class="logo"><div class="logo-icon">支</div><div class="logo-text"><h1>晴天支付</h1><p>QingTian Pay</p></div></div>
    <div class="nav-links"><a href="index.html">首页</a><a href="docs.html">开发者文档</a><a href="merchant.html">商户中心</a><a href="support.html">帮助支持</a></div>
    <a href="login.html" class="btn-header">商户入驻</a>
  </div>
  
  <div class="card" style="max-width: 420px; margin: 60px auto;">
    <div style="display: flex; border-bottom: 1px solid #eee; margin-bottom: 30px;">
      <div id="tab-login" class="tab active" onclick="switchTab('login')">登录</div>
      <div id="tab-reg" class="tab" onclick="switchTab('reg')">注册入驻</div>
    </div>

    <div class="form-group"><label>邮箱</label><input type="email" id="email" placeholder="you@example.com"></div>
    <div class="form-group"><label>密码</label><input type="password" id="password" placeholder="至少6位密码"></div>
    
    <div id="code-group" class="form-group" style="display: none;">
      <label>邮箱验证码</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="code" placeholder="6位验证码" style="flex:1;">
        <button id="btn-send" onclick="sendCode()" class="btn-outline" style="padding: 0 15px; white-space: nowrap;">获取验证码</button>
      </div>
    </div>

    <button id="btn-submit" onclick="submitAuth()" class="btn-primary" style="width: 100%; margin-top: 10px;">登 录</button>
  </div>

  <script>
    let isLogin = true;

    function switchTab(type) {
      isLogin = (type === 'login');
      document.getElementById('tab-login').className = isLogin ? 'tab active' : 'tab';
      document.getElementById('tab-reg').className = !isLogin ? 'tab active' : 'tab';
      document.getElementById('code-group').style.display = isLogin ? 'none' : 'block';
      document.getElementById('btn-submit').textContent = isLogin ? '登 录' : '注册并入驻';
    }

    let timer = null;
    async function sendCode() {
      const email = document.getElementById('email').value.trim();
      if (!email) return toast('请输入邮箱', true);
      
      const btn = document.getElementById('btn-send');
      btn.disabled = true; btn.textContent = '发送中...';

      try {
        await apiFetch('/passport/auth/send-code', { email });
        toast('验证码已发送至邮箱');
        let sec = 60;
        btn.textContent = sec + 's 后重试';
        timer = setInterval(() => {
          sec--;
          if (sec <= 0) {
            clearInterval(timer);
            btn.disabled = false; btn.textContent = '获取验证码';
          } else {
            btn.textContent = sec + 's 后重试';
          }
        }, 1000);
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false; btn.textContent = '获取验证码';
      }
    }

    async function submitAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const code = document.getElementById('code').value.trim();

      if (!email || !password) return toast('请填写邮箱和密码', true);
      if (!isLogin && !code) return toast('请填写验证码', true);

      const btn = document.getElementById('btn-submit');
      btn.disabled = true; btn.textContent = '处理中...';

      try {
        if (!isLogin) {
          await apiFetch('/passport/auth/register', { email, password, code });
          toast('注册成功，正在登录...');
        }
        const res = await apiFetch('/passport/auth/login', { email, password });
        setToken(res.data.token);
        toast('登录成功');
        setTimeout(() => window.location.href = 'merchant.html', 800);
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false; btn.textContent = isLogin ? '登 录' : '注册并入驻';
      }
    }
  </script>
</body>
</html>
