<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>提现申请 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/console.css">
  <style>
    .page-head h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .page-head p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    .balance-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
    .balance-row b { font-size: 30px; font-weight: 700; color: var(--primary); letter-spacing: -1px; }
    .balance-row span { font-size: 13px; color: var(--text-muted); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .field input, .field select { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; font-size: 15px; outline: none; background: var(--surface); font-family: inherit; color: var(--text-main); transition: border .2s, box-shadow .2s; }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn-primary { width: 100%; height: 46px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(37,99,235,0.25); }
    .btn-primary[disabled] { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <div class="left"><button class="menu-btn" onclick="lynDrawerOpen()" aria-label="打开菜单">☰</button><span>提现申请</span></div>
    <a href="merchant.html" style="font-size:13px;color:var(--primary);font-weight:600">看板</a>
  </div>
  <aside class="lyn-sidebar">
    <div class="lyn-side-head">
      <img src="assets/logo.png" alt="晴天支付">
      <div><h2>晴天支付</h2><p>商户服务平台</p></div>
    </div>
    <div class="lyn-side-body">
      <div class="lyn-group">商户工作台</div>
      <a href="merchant.html" class="lyn-item"><span class="lyn-ic lyn-ic-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg></span>数据看板</a>
      <a href="javascript:void(0)" class="lyn-item" onclick="lynTestPay()"><span class="lyn-ic lyn-ic-amber"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></span>发起测试支付</a>
      <a href="api.html" class="lyn-item"><span class="lyn-ic lyn-ic-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m3-2a5 5 0 01-7.5 4.3L8 16v3H5v-3H2v-3h3l4.7-4.5A5 5 0 1120 7z"/></svg></span>API 信息</a>
      <div class="lyn-group">交易与资金</div>
      <a href="orders.html" class="lyn-item"><span class="lyn-ic lyn-ic-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></span>交易流水</a>
      <a href="withdraw.html" class="lyn-item active"><span class="lyn-ic lyn-ic-green"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg></span>提现申请</a>
      <div class="lyn-group">其他</div>
      <a href="index.html" class="lyn-item"><span class="lyn-ic lyn-ic-orange"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></span>返回首页</a>
      <a href="docs.html" class="lyn-item"><span class="lyn-ic lyn-ic-orange"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h13l3 3v13H4zM8 9h8M8 13h8M8 17h5"/></svg></span>开发文档</a>
    </div>
    <div class="lyn-side-foot" id="lynSideFoot"><span>未登录</span></div>
  </aside>

  <div class="lyn-mask" id="lynMask" onclick="lynDrawerClose()"></div>
  <div class="lyn-drawer" id="lynDrawer">
    <div class="lyn-drawer-head">
      <div class="lyn-drawer-logo-area">
        <img src="assets/logo.png" alt="晴天支付">
        <div class="lyn-drawer-title"><h2>晴天支付</h2><p>商户服务平台</p></div>
      </div>
      <button class="lyn-drawer-x" onclick="lynDrawerClose()" aria-label="关闭">✕</button>
    </div>
    <div class="lyn-drawer-body">
      <div class="lyn-group">商户工作台</div>
      <a href="merchant.html" class="lyn-item"><span class="lyn-ic lyn-ic-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg></span>数据看板</a>
      <a href="javascript:void(0)" class="lyn-item" onclick="lynTestPay()"><span class="lyn-ic lyn-ic-amber"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></span>发起测试支付</a>
      <div class="lyn-group">交易与资金</div>
      <a href="orders.html" class="lyn-item"><span class="lyn-ic lyn-ic-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></span>交易流水</a>
      <a href="withdraw.html" class="lyn-item active"><span class="lyn-ic lyn-ic-green"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg></span>提现申请</a>
      <div class="lyn-group">其他</div>
      <a href="index.html" class="lyn-item"><span class="lyn-ic lyn-ic-orange"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></span>返回首页</a>
      <a href="docs.html" class="lyn-item"><span class="lyn-ic lyn-ic-orange"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h13l3 3v13H4zM8 9h8M8 13h8M8 17h5"/></svg></span>开发文档</a>
    </div>
  </div>

  <div class="console-main">
    <div class="page-head"><h1>提现申请</h1><p>T+0 · 平台审核打款 · 最低 1 元</p></div>
    <div class="card">
      <div class="balance-row"><b id="wd-balance">--</b><span>可提现余额（元）</span></div>
      <div class="field"><label>提现金额（元）</label><input id="wd-amt" type="number" min="1" step="0.01" placeholder="如 100.00" inputmode="decimal"></div>
      <div class="field"><label>结算方式</label>
        <select id="wd-type" onchange="onTypeChange()">
          <option value="alipay">支付宝（人民币打款）</option>
          <option value="usdt">USDT · TRC20（数字货币结算）</option>
        </select>
      </div>
      <div class="field"><label id="wd-acc-label">收款账号（支付宝账号）</label><input id="wd-acc" placeholder="用于接收打款的支付宝账号"></div>
      <button class="btn-primary" id="wd-btn" onclick="doWithdraw()">提交提现申请</button>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:16px">提现记录</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>ID</th><th>金额</th><th>结算方式</th><th>收款账号</th><th>状态</th><th>备注</th><th>时间</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="empty-tip">加载中…</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="assets/api.js"></script>
  <script>
(function(){
    if (!requireLogin()) return;
    function lynDrawerOpen() { document.getElementById('lynDrawer').classList.add('open'); document.getElementById('lynMask').classList.add('show'); document.body.style.overflow = 'hidden'; }
    function lynDrawerClose() { document.getElementById('lynDrawer').classList.remove('open'); document.getElementById('lynMask').classList.remove('show'); document.body.style.overflow = ''; }
    async function load() {
      try {
        const jm = await apiGet("/payplat/merchant/info");
        document.getElementById('wd-balance').textContent = money(jm.data && jm.data.balance);
        const jw = await apiGet("/payplat/merchant/withdrawals");
        const list = (jw && jw.data) || [];
        const ST = { 0: ["待审核", "warn"], 1: ["已打款", "ok"], 2: ["已拒绝", "flat"] };
        document.getElementById('tbody').innerHTML = list.length ? list.map(w =>
          "<tr><td>#" + w.id + "</td><td><b>¥" + money(w.amount) + "</b></td><td>" + (w.account_type === "usdt" ? "USDT·TRC20" : "支付宝") + "</td><td>" + esc(w.account) + "</td>" +
          "<td><span class='badge " + ((ST[w.status] || [])[1] || "flat") + "'>" + ((ST[w.status] || ["未知"])[0]) + "</span></td>" +
          "<td>" + esc(w.remark || "-") + "</td><td>" + fmtTime(w.created_at) + "</td></tr>").join("")
          : "<tr><td colspan='7' class='empty-tip'>暂无提现记录</td></tr>";
      } catch (e) { toast(e.message || e, true); }
    }
    function onTypeChange() {
      const t = document.getElementById('wd-type').value;
      document.getElementById('wd-acc-label').textContent = t === "usdt" ? "USDT 收款地址（TRC20）" : "收款账号（支付宝账号）";
      document.getElementById('wd-acc').placeholder = t === "usdt" ? "以 T 开头的 TRC20 钱包地址" : "用于接收打款的支付宝账号";
    }
    async function doWithdraw() {
      const amount = parseFloat(document.getElementById('wd-amt').value);
      const account = document.getElementById('wd-acc').value.trim();
      const accountType = document.getElementById('wd-type').value;
      if (!(amount >= 1)) return toast("请输入有效金额（最低 1 元）", true);
      if (!account) return toast("请输入收款账号", true);
      const btn = document.getElementById('wd-btn'); btn.disabled = true;
      try {
        const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() };
        const res = await fetch(API_BASE + "/payplat/merchant/withdraw", { method: "POST", headers, body: JSON.stringify({ amount, account, account_type: accountType }) });
        const j = await res.json().catch(() => null);
        if (!res.ok) throw new Error((j && (j.message || j.msg)) || "提交失败");
        toast("提现申请已提交，等待审核");
        document.getElementById('wd-amt').value = "";
        load();
      } catch (e) { toast(e.message || e, true); }
      btn.disabled = false;
    }
    load();
window.lynDrawerOpen = lynDrawerOpen; window.lynDrawerClose = lynDrawerClose;
})();
</script>
</body>
</html>
