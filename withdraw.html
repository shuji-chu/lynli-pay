<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>提现申请 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    :root { --primary: #2563eb; --primary-light: #eff6ff; --bg: #f8fafc; --surface: #fff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; background: var(--bg); color: var(--text-main); }
    a { text-decoration: none; color: inherit; }
    .mobile-topbar { display: flex; align-items: center; justify-content: space-between; height: 64px; background: var(--surface); padding: 0 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 90; }
    .mobile-topbar .left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; }
    .menu-btn { font-size: 24px; cursor: pointer; padding: 8px; border-radius: 8px; background: none; border: none; color: var(--text-main); }
    .lyn-mask { position: fixed; inset: 0; background: rgba(15,23,42,0.4); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 9998; opacity: 0; pointer-events: none; transition: opacity .4s cubic-bezier(0.32,0.72,0,1); }
    .lyn-mask.show { opacity: 1; pointer-events: auto; }
    .lyn-drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 85%; max-width: 320px; background: var(--surface); z-index: 9999; display: flex; flex-direction: column; border-radius: 0 24px 24px 0; box-shadow: 10px 0 30px -5px rgba(0,0,0,.1); transform: translateX(-100%); will-change: transform; transition: transform .45s cubic-bezier(0.32,0.72,0,1); }
    .lyn-drawer.open { transform: translateX(0); }
    .lyn-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 24px 20px 20px; }
    .lyn-drawer-logo-area { display: flex; align-items: center; gap: 14px; }
    .lyn-drawer-logo-area img { width: 48px; height: 48px; border-radius: 14px; }
    .lyn-drawer-title h2 { font-size: 19px; font-weight: 700; }
    .lyn-drawer-title p { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
    .lyn-drawer-x { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: none; font-size: 18px; color: var(--text-muted); cursor: pointer; }
    .lyn-drawer-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 24px; }
    .lyn-group { font-size: 12px; color: #94a3b8; margin: 24px 12px 8px; font-weight: 600; letter-spacing: 1px; }
    .lyn-item { display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 8px; border-radius: 14px; font-size: 15px; color: #334155; font-weight: 500; }
    .lyn-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .lyn-item:active { background: var(--bg); }
    .lyn-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .lyn-ic svg { width: 20px; height: 20px; }
    .lyn-ic-blue { background: #eff6ff; color: #2563eb; } .lyn-ic-green { background: #ecfdf5; color: #059669; }
    .lyn-ic-purple { background: #f5f3ff; color: #7c3aed; } .lyn-ic-amber { background: #fffbeb; color: #d97706; }
    .lyn-ic-orange { background: #fff7ed; color: #ea580c; }
    .main { padding: 24px 20px; max-width: 680px; margin: 0 auto; }
    .page-head h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .page-head p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
    .balance-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
    .balance-row b { font-size: 30px; font-weight: 700; color: var(--primary); letter-spacing: -1px; }
    .balance-row span { font-size: 13px; color: var(--text-muted); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .field input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none; background: var(--bg); font-family: inherit; transition: border .2s; }
    .field input:focus { border-color: var(--primary); background: #fff; }
    .btn-primary { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-primary[disabled] { opacity: .5; pointer-events: none; }
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th, .tbl td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl th { background: var(--bg); color: var(--text-muted); font-weight: 600; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .badge.ok { background: #ecfdf5; color: #059669; } .badge.warn { background: #fffbeb; color: #d97706; } .badge.flat { background: #f1f5f9; color: #64748b; }
    .empty-tip { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0; }
    @media (prefers-reduced-motion: reduce) { .lyn-drawer, .lyn-mask { transition: none; } }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <div class="left"><button class="menu-btn" onclick="lynDrawerOpen()" aria-label="打开菜单">☰</button><span>提现申请</span></div>
    <a href="merchant.html" style="font-size:13px;color:var(--primary);font-weight:600">看板</a>
  </div>
  <div class="lyn-mask" id="lynMask" onclick="lynDrawerClose()"></div>
  <div class="lyn-drawer" id="lynDrawer">
    <div class="lyn-drawer-head">
      <div class="lyn-drawer-logo-area">
        <img src="assets/logo.png" alt="晴天支付">
        <div class="lyn-drawer-title"><h2>晴天支付</h2><p>商户服务平台</p></div>
      </div>
      <button class="lyn-drawer-x" onclick="lynDrawerClose()" aria-label="关闭">✕</button>
    </div>
    <div class="lyn-drawer-body">
      <div class="lyn-group">商户工作台</div>
      <a href="merchant.html" class="lyn-item"><span class="lyn-ic lyn-ic-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg></span>数据看板</a>
      <a href="javascript:void(0)" class="lyn-item" onclick="lynTestPay()"><span class="lyn-ic lyn-ic-amber"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></span>发起测试支付</a>
      <div class="lyn-group">交易与资金</div>
      <a href="orders.html" class="lyn-item"><span class="lyn-ic lyn-ic-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></span>交易流水</a>
      <a href="withdraw.html" class="lyn-item active"><span class="lyn-ic lyn-ic-green"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg></span>提现申请</a>
      <div class="lyn-group">其他</div>
      <a href="index.html" class="lyn-item"><span class="lyn-ic lyn-ic-orange"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></span>返回首页</a>
      <a href="docs.html" class="lyn-item"><span class="lyn-ic lyn-ic-orange"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h13l3 3v13H4zM8 9h8M8 13h8M8 17h5"/></svg></span>开发文档</a>
    </div>
  </div>

  <div class="main">
    <div class="page-head"><h1>提现申请</h1><p>T+0 · 平台审核打款 · 最低 1 元</p></div>
    <div class="card">
      <div class="balance-row"><b id="wd-balance">--</b><span>可提现余额（元）</span></div>
      <div class="field"><label>提现金额（元）</label><input id="wd-amt" type="number" min="1" step="0.01" placeholder="如 100.00" inputmode="decimal"></div>
      <div class="field"><label>收款账号（支付宝账号）</label><input id="wd-acc" placeholder="用于接收打款的支付宝账号"></div>
      <button class="btn-primary" id="wd-btn" onclick="doWithdraw()">提交提现申请</button>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:16px">提现记录</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>ID</th><th>金额</th><th>收款账号</th><th>状态</th><th>备注</th><th>时间</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" class="empty-tip">加载中…</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="assets/api.js"></script>
  <script>
    if (!requireLogin()) throw new Error("need login");
    function lynDrawerOpen() { document.getElementById('lynDrawer').classList.add('open'); document.getElementById('lynMask').classList.add('show'); document.body.style.overflow = 'hidden'; }
    function lynDrawerClose() { document.getElementById('lynDrawer').classList.remove('open'); document.getElementById('lynMask').classList.remove('show'); document.body.style.overflow = ''; }
    async function load() {
      try {
        const jm = await apiGet("/payplat/merchant/info");
        document.getElementById('wd-balance').textContent = money(jm.data && jm.data.balance);
        const jw = await apiGet("/payplat/merchant/withdrawals");
        const list = (jw && jw.data) || [];
        const ST = { 0: ["待审核", "warn"], 1: ["已打款", "ok"], 2: ["已拒绝", "flat"] };
        document.getElementById('tbody').innerHTML = list.length ? list.map(w =>
          "<tr><td>#" + w.id + "</td><td><b>¥" + money(w.amount) + "</b></td><td>" + esc(w.account) + "</td>" +
          "<td><span class='badge " + ((ST[w.status] || [])[1] || "flat") + "'>" + ((ST[w.status] || ["未知"])[0]) + "</span></td>" +
          "<td>" + esc(w.remark || "-") + "</td><td>" + fmtTime(w.created_at) + "</td></tr>").join("")
          : "<tr><td colspan='6' class='empty-tip'>暂无提现记录</td></tr>";
      } catch (e) { toast(e.message || e, true); }
    }
    async function doWithdraw() {
      const amount = parseFloat(document.getElementById('wd-amt').value);
      const account = document.getElementById('wd-acc').value.trim();
      if (!(amount >= 1)) return toast("请输入有效金额（最低 1 元）", true);
      if (!account) return toast("请输入收款账号", true);
      const btn = document.getElementById('wd-btn'); btn.disabled = true;
      try {
        const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() };
        const res = await fetch(API_BASE + "/payplat/merchant/withdraw", { method: "POST", headers, body: JSON.stringify({ amount, account, account_type: "alipay" }) });
        const j = await res.json().catch(() => null);
        if (!res.ok) throw new Error((j && (j.message || j.msg)) || "提交失败");
        toast("提现申请已提交，等待审核");
        document.getElementById('wd-amt').value = "";
        load();
      } catch (e) { toast(e.message || e, true); }
      btn.disabled = false;
    }
    load();
  </script>
</body>
</html>
