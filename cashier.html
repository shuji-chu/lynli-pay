<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>收银台 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --surface: #fff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; background: linear-gradient(165deg, #eef4ff 0%, #f8fafc 60%); color: var(--text-main); min-height: 100vh; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 40px 20px calc(40px + env(safe-area-inset-bottom, 0px)); }
    .cashier { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 36px 28px; text-align: center; box-shadow: 0 20px 50px -12px rgba(37,99,235,.15); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; }
    .brand span { font-size: 15px; font-weight: 700; }
    .amt { font-size: 44px; font-weight: 800; color: var(--primary); letter-spacing: -2px; margin: 8px 0 4px; }
    .name { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; word-break: break-all; }
    .qr-box { margin: 0 auto 18px; width: 224px; height: 224px; padding: 12px; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 24px rgba(37,99,235,.1); }
    .qr-box img { width: 100%; height: 100%; image-rendering: pixelated; }
    .addr-box { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px dashed var(--border); border-radius: 12px; padding: 12px; margin: 16px 0; text-align: left; }
    .addr-box code { flex: 1; font-size: 12px; word-break: break-all; color: var(--primary); font-family: "SF Mono", Consolas, monospace; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; padding: 12px 24px; font-family: inherit; transition: transform .2s; }
    .btn:active { transform: scale(.97); }
    .btn-primary { color: #fff; background: var(--primary); }
    .btn-ghost { color: var(--primary); background: var(--bg); border: 1px solid var(--border); }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
    .pay-state { margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .success-ic { width: 72px; height: 72px; margin: 8px auto 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #fff; background: linear-gradient(135deg, #059669, #34d399); box-shadow: 0 10px 30px rgba(5,150,105,.35); }
    .err-ic { background: linear-gradient(135deg, #dc2626, #f87171); }
    .empty-tip { color: var(--text-muted); font-size: 14px; padding: 30px 0; }
    .sub-h { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="wrap"><div class="cashier" id="box"><div class="empty-tip">加载中…</div></div></div>
  <div id="toast"></div>
  <script src="assets/api.js"></script>
  <script>
    let pollTimer = null;
    const q = new URLSearchParams(location.search);
    const no = q.get("trade_no") || "";

    function esc2(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    async function render(state) {
      const box = document.getElementById("box");
      try {
        const res = await fetch(API_BASE + "/payplat/cashier/status?trade_no=" + encodeURIComponent(no));
        const j = await res.json().catch(() => null);
        const d = j && (j.data || j);
        if (!res.ok || !d || !d.trade_no) {
          box.innerHTML = '<div class="success-ic err-ic">✕</div><div class="sub-h">订单不存在</div><p class="pay-state">请核对订单号：' + esc2(no) + '</p>';
          clearInterval(pollTimer); return;
        }
        if (d.paid || Number(d.status) >= 2) {
          clearInterval(pollTimer);
          box.innerHTML = '<div class="success-ic">✓</div><div class="sub-h">支付成功</div>' +
            '<div class="amt">¥' + money(d.amount) + '</div>' +
            '<p class="name">' + esc2(d.name || "") + ' · 单号 ' + esc2(d.trade_no) + '</p>' +
            '<p class="pay-state">货款已按 90% 自动计入商户余额</p>' +
            '<button class="btn btn-primary" style="margin-top:20px;width:100%" onclick="location.href=\'merchant.html\'">进入商户中心</button>';
          return;
        }
        let payPart;
        if (d.method === "usdt") {
          payPart = '<div class="sub-h">TRC20 · USDT 转账</div>' +
            '<div class="addr-box"><code id="usdt-addr">' + (d.address ? esc2(d.address) + '（' + esc2(d.network || "TRC20") + '）' : '正在获取收款地址…') + '</code>' +
            (d.address ? '<button class="btn btn-ghost btn-sm" onclick="copyText(document.getElementById(\'usdt-addr\').textContent)">复制</button>' : '') + '</div>' +
            '<p class="pay-state">请向以上地址转账对应金额，链上确认后自动到账</p>';
        } else {
          payPart = '<div class="sub-h">支付宝扫码支付</div>' +
            '<div class="qr-box">' + (d.payurl || d.qrcode ? '<img id="alipay-qr" alt="支付宝收款码">' : '<div class="empty-tip">等待生成…</div>') + '</div>' +
            (d.payurl ? '<button class="btn btn-ghost btn-sm" onclick="copyText(\'' + esc2(d.payurl) + '\')">复制支付链接</button>' : '') +
            '<p class="pay-state">请使用支付宝 App 扫一扫完成支付</p>';
        }
        box.innerHTML = '<div class="brand"><img src="assets/logo.png" alt=""><span>晴天收银台</span></div>' +
          '<div class="amt">¥' + money(d.amount) + '</div>' +
          '<p class="name">' + esc2(d.name || "") + ' · 单号 ' + esc2(d.trade_no) + '</p>' + payPart +
          '<p class="pay-state"><span class="dot"></span>等待支付确认，每 3 秒自动刷新</p>';
        if (d.method !== "usdt" && d.payurl) {
          document.getElementById("alipay-qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(d.payurl);
        }
      } catch (e) {
        box.innerHTML = '<div class="success-ic err-ic">✕</div><div class="sub-h">加载失败</div><p class="pay-state">' + esc2(String(e.message || e).slice(0, 100)) + '</p>';
      }
    }
    if (!no) {
      document.getElementById("box").innerHTML = '<div class="success-ic err-ic">✕</div><div class="sub-h">缺少订单号</div><p class="pay-state">请从商户站跳转，或在首页查询框输入订单号</p><button class="btn btn-primary" style="margin-top:20px;width:100%" onclick="location.href=\'index.html\'">返回首页</button>';
    } else {
      render();
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(API_BASE + "/payplat/cashier/status?trade_no=" + encodeURIComponent(no));
          const j = await res.json().catch(() => null);
          const d = j && (j.data || j);
          if (d && (d.paid || Number(d.status) >= 2)) { toast("支付成功！"); render(d); }
        } catch (e) { /* 静默重试 */ }
      }, 3000);
    }
  </script>
</body>
</html>
