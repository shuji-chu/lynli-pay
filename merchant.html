<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商户中心 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="assets/style.css">
  <style>
    .avatar-container { position: relative; cursor: pointer; display: inline-block; margin-left: auto; }
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; }
    .avatar-default { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; }
  </style>
</head>
<body>
  <div class="header" style="justify-content: space-between;">
    <div class="logo"><img src="assets/logo.png" alt="晴天支付"><div class="logo-text"><h1>晴天支付</h1></div></div>
    <div class="nav-links" id="navLinks" style="margin-left: 40px; margin-right: auto;"><a href="index.html">首页</a><a href="docs.html">开发者文档</a><a href="merchant.html" class="active">商户中心</a><a href="support.html">帮助支持</a></div>
    <div class="avatar-container" onclick="document.getElementById('avatarInput').click()">
      <img id="avatarImg" class="avatar-img" src="" style="display: none;">
      <div id="avatarDefault" class="avatar-default">👤</div>
      <input type="file" id="avatarInput" style="display: none;" accept="image/*" onchange="handleAvatarUpload(event)">
    </div>
    <div class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('mobile-show')">☰</div>
  </div>

  <div class="dashboard">
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
      <div class="menu-title">商户工作台</div>
      <div class="menu-item">用户中心</div>
      <div class="menu-item active">个人资料</div>
      <div class="menu-title">交易与资金</div>
      <div class="menu-item">订单记录</div>
      <div class="menu-item">提现记录</div>
      <div class="menu-title">其他</div>
      <div class="menu-item"><a href="docs.html" style="color:inherit;">开发文档</a></div>
      <div class="menu-item" onclick="logout()">退出登录</div>
    </div>
    <div class="main-content">
      <div class="mobile-header"><div class="menu-toggle" onclick="toggleMenu()">☰</div><h2 style="font-size: 18px; margin: 0;">个人资料</h2></div>
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 24px;">
        <div style="font-size: 20px; font-weight: 700;">API信息</div>
        <div><a href="javascript:void(0)" onclick="logout()" style="color: var(--text-muted); font-size:14px;">退出登录</a></div>
      </div>
      
      <div class="card" style="margin-bottom: 24px;">
        <div style="font-size:16px; font-weight:600; margin-bottom: 20px;">V1接口（MD5签名方式）</div>
        <div class="form-group"><label>接口地址</label><input type="text" value="https://api.lynli.me/" readonly style="background:#f1f5f9;"></div>
        <div class="form-group"><label>商户ID</label><input type="text" id="mch-id" value="5466" readonly style="background:#f1f5f9;"></div>
        <div class="form-group">
          <label>商户MD5密钥</label>
          <input type="text" id="mch-key" value="d0498216697be28ddb79802a9f6b4bae25" readonly style="background:#f1f5f9;">
        </div>
        <div style="margin-top: 30px; display: flex; gap: 16px;">
          <a href="docs.html" class="btn-outline" style="padding: 10px 20px; font-size: 14px;">查看文档</a>
          <button class="btn-primary" onclick="testPay()" style="padding: 10px 20px; font-size: 14px;">发起测试支付 (0.01元)</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="assets/api.js"></script>
  <script>
    if (!getToken()) window.location.href = 'login.html';
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }
    async function testPay() {
      try {
        toast('正在发起支付宝支付...');
        const res = await apiFetch('/pay/create', { out_trade_no: 'ALI' + Date.now(), amount: 0.01 });
        if (res.code === 200 && res.pay_url) { toast('跳转收银台...'); window.location.href = res.pay_url; } 
        else { toast('发起失败: ' + (res.msg || res.message || '未知错误'), true); }
      } catch (e) { toast(e.message, true); }
    }
    async function handleAvatarUpload(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('avatarImg').src = evt.target.result;
        document.getElementById('avatarImg').style.display = 'block';
        document.getElementById('avatarDefault').style.display = 'none';
      };
      reader.readAsDataURL(file);
      try { await uploadAvatar(file); toast('头像更新成功'); } catch (err) { toast('上传失败: ' + err.message, true); }
    }
  </script>
</body>
</html>
