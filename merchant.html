<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商户控制台 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    /* ===== 基础与变量 ===== */
    :root {
      --primary: #0a66ff;
      --primary-light: #f0f7ff;
      --bg: #f4f6f8;
      --text: #111;
      --text-muted: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
    a { text-decoration: none; color: inherit; }

    /* ===== 移动端顶栏 ===== */
    .mobile-topbar {
      display: none; align-items: center; justify-content: space-between;
      height: 60px; background: #fff; padding: 0 16px;
      border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 90;
    }
    .mobile-topbar .left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; }
    .menu-btn { font-size: 24px; cursor: pointer; padding: 4px; }

    /* ===== 抽屉遮罩 (毛玻璃) ===== */
    .drawer-mask {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      z-index: 9998; opacity: 0; transition: opacity 0.3s ease;
    }
    .drawer-mask.show { display: block; opacity: 1; }

    /* ===== 侧边抽屉主体 (丝滑动画) ===== */
    .drawer {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 85%; max-width: 320px;
      background: #ffffff;
      z-index: 9999;
      display: flex; flex-direction: column;
      border-radius: 0 20px 20px 0;
      box-shadow: 4px 0 24px rgba(0,0,0,0.1);
      /* 核心：使用 transform 触发 GPU 硬件加速，绝对丝滑 */
      transform: translateX(-100%);
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drawer.open { transform: translateX(0); }

    /* 抽屉头部 */
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 20px 20px;
    }
    .drawer-logo-area { display: flex; align-items: center; gap: 12px; }
    .drawer-logo-area img { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,102,255,0.2); }
    .drawer-title h2 { margin: 0; font-size: 18px; color: #111; font-weight: bold; }
    .drawer-title p { margin: 2px 0 0 0; font-size: 12px; color: #888; }
    .drawer-close { 
      width: 32px; height: 32px; border-radius: 50%; background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #666; cursor: pointer; 
    }

    /* 抽屉内容区 */
    .drawer-body { flex: 1; overflow-y: auto; padding: 0 16px 20px; }
    .drawer-group { font-size: 12px; color: #999; margin: 16px 8px 8px; font-weight: 500; }

    /* 卡片式菜单项 */
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; margin-bottom: 4px;
      border-radius: 12px; font-size: 15px; color: #333;
      transition: background 0.2s;
    }
    .drawer-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    
    /* 图标底色 */
    .icon-box { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-box svg { width: 20px; height: 20px; }
    
    .icon-blue { background: #eef3ff; color: #0a66ff; }
    .drawer-item.active .icon-blue { background: #0a66ff; color: #fff; }
    
    .icon-purple { background: #f4ebff; color: #9333ea; }
    .icon-green { background: #e6f7f0; color: #059669; }

    /* 子菜单 */
    .drawer-sub-menu {
      margin-left: 30px; padding-left: 16px;
      border-left: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }
    .drawer-sub-item { padding: 10px 0; font-size: 14px; color: #666; }
    .drawer-sub-item.active { color: var(--primary); font-weight: 500; }

    /* 主内容区 (占位测试) */
    .main-content { display: none; }
    .mobile-main { display: block; padding: 20px 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card h3 { margin-bottom: 10px; font-size: 16px; }

    /* 响应式适配 */
    @media (min-width: 769px) {
      .mobile-topbar { display: none; }
      .drawer, .drawer-mask { display: none !important; }
      .mobile-main { display: none; }
      .main-content { display: block; max-width: 800px; margin: 40px auto; }
    }
    @media (max-width: 768px) {
      .mobile-topbar { display: flex; }
    }
  </style>
</head>
<body>

  <!-- ===== 移动端顶栏 ===== -->
  <div class="mobile-topbar">
    <div class="left">
      <div class="menu-btn" onclick="toggleDrawer(true)">☰</div>
      <span>个人资料</span>
    </div>
    <div style="width: 32px; height: 32px; border-radius: 50%; background: #eef3ff; display: flex; align-items: center; justify-content: center; color: #0a66ff;">👤</div>
  </div>

  <!-- ===== 遮罩层 ===== -->
  <div class="drawer-mask" id="drawerMask" onclick="toggleDrawer(false)"></div>

  <!-- ===== 抽屉层 (完全复刻 nzzf 卡片) ===== -->
  <div class="drawer" id="drawer">
    <!-- 头部 -->
    <div class="drawer-header">
      <div class="drawer-logo-area">
        <img src="assets/logo.png" alt="晴天支付">
        <div class="drawer-title">
          <h2>晴天支付</h2>
          <p>商户服务平台</p>
        </div>
      </div>
      <div class="drawer-close" onclick="toggleDrawer(false)">✕</div>
    </div>

    <!-- 内容区 -->
    <div class="drawer-body">
      
      <div class="drawer-group">商户工作台</div>
      
      <a href="#" class="drawer-item">
        <div class="icon-box icon-blue">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        </div>
        用户中心
      </a>

      <!-- 高亮的个人资料卡片 -->
      <div class="drawer-item active" onclick="toggleSubMenu()">
        <div class="icon-box icon-blue">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        个人资料
        <svg style="margin-left: auto; width: 16px; height: 16px; transition: transform 0.3s;" id="subMenuArrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </div>

      <!-- 个人资料的子菜单 -->
      <div class="drawer-sub-menu" id="subMenu">
        <div class="drawer-sub-item active">API信息</div>
        <div class="drawer-sub-item">修改资料</div>
      </div>

      <div class="drawer-group">交易与资金</div>
      
      <a href="#" class="drawer-item">
        <div class="icon-box icon-purple">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        订单记录
      </a>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-purple">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        </div>
        提现记录
      </a>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-purple">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        </div>
        资金明细
      </a>

      <div class="drawer-group">其他</div>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        </div>
        聚合收款
      </a>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        开发文档
      </a>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </div>
        联系客服
      </a>

    </div>
  </div>

  <!-- ===== 页面测试内容 ===== -->
  <div class="mobile-main">
    <div class="card">
      <h3>API 信息</h3>
      <p style="color: #666; font-size: 14px; margin-top: 10px;">接口地址: https://api.lynli.me/</p>
    </div>
  </div>
  <div class="main-content">
    <div class="card">
      <h3>桌面端视图</h3>
      <p>PC 端请使用宽屏查看。</p>
    </div>
  </div>

  <script>
    // 丝滑开关抽屉
    function toggleDrawer(show) {
      const drawer = document.getElementById('drawer');
      const mask = document.getElementById('drawerMask');
      
      if (show) {
        mask.style.display = 'block';
        // 强制重绘，保证过渡动画生效
        void mask.offsetWidth; 
        mask.classList.add('show');
        drawer.classList.add('open');
        document.body.style.overflow = 'hidden';
      } else {
        mask.classList.remove('show');
        drawer.classList.remove('open');
        document.body.style.overflow = 'auto';
        // 等待动画结束再隐藏 display
        setTimeout(() => {
          if (!drawer.classList.contains('open')) {
            mask.style.display = 'none';
          }
        }, 300);
      }
    }

    // 展开/收起个人资料子菜单
    function toggleSubMenu() {
      const subMenu = document.getElementById('subMenu');
      const arrow = document.getElementById('subMenuArrow');
      if (subMenu.style.display === 'none' || subMenu.style.display === '') {
        subMenu.style.display = 'block';
        arrow.style.transform = 'rotate(180deg)';
      } else {
        subMenu.style.display = 'none';
        arrow.style.transform = 'rotate(0deg)';
      }
    }
  </script>
</body>
</html>
