<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商户控制台 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ======= 基础重置 ======= */
    body { background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; margin: 0; }
    * { box-sizing: border-box; }

    /* ======= 移动端顶部导航条 ======= */
    .mobile-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      background: #fff;
      padding: 0 16px;
      border-bottom: 1px solid #eee;
      position: sticky; top: 0; z-index: 100;
    }
    .mobile-topbar .left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; }
    .mobile-topbar .menu-btn { font-size: 24px; color: #111; cursor: pointer; }
    .mobile-topbar .avatar { width: 32px; height: 32px; border-radius: 50%; background: #eef3ff; display: flex; align-items: center; justify-content: center; color: #0a66ff; }

    /* ======= 移动端抽屉遮罩 ======= */
    .mobile-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px); /* 毛玻璃模糊效果 */
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .mobile-overlay.show { display: block; opacity: 1; }

    /* ======= 移动端抽屉主体 ======= */
    .mobile-drawer {
      position: fixed; top: 0; bottom: 0; left: -100%;
      width: 80vw; max-width: 320px;
      background: #fff;
      z-index: 1001;
      display: flex; flex-direction: column;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 0 16px 16px 0;
      box-shadow: 4px 0 24px rgba(0,0,0,0.1);
    }
    .mobile-drawer.open { left: 0; }

    /* 抽屉头部 */
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px;
    }
    .drawer-logo { display: flex; align-items: center; gap: 12px; }
    .drawer-logo img { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,102,255,0.2); }
    .drawer-title h2 { margin: 0; font-size: 18px; color: #111; }
    .drawer-title p { margin: 2px 0 0 0; font-size: 12px; color: #888; }
    .drawer-close { font-size: 20px; color: #999; cursor: pointer; padding: 8px; }

    /* 抽屉滚动区 */
    .drawer-body { flex: 1; overflow-y: auto; padding: 0 12px 20px; }

    /* 菜单分组标题 */
    .drawer-group-title {
      font-size: 12px; color: #999; margin: 16px 12px 8px; letter-spacing: 1px;
    }

    /* 主菜单项 */
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; margin-bottom: 4px;
      border-radius: 12px; cursor: pointer;
      font-size: 15px; color: #333;
    }
    .drawer-item.active { background: #f0f7ff; color: #0a66ff; font-weight: 600; }
    .drawer-item .icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .drawer-item .icon svg { width: 18px; height: 18px; }
    .drawer-item.active .icon { background: #0a66ff; color: #fff; }
    .drawer-item.active .icon svg { stroke: #fff; }
    .drawer-item .icon-blue { background: #eef3ff; color: #0a66ff; }
    .drawer-item .icon-purple { background: #f4ebff; color: #9333ea; }
    .drawer-item .icon-green { background: #e6f7f0; color: #059669; }
    .drawer-item .icon-gray { background: #f3f4f6; color: #4b5563; }
    .drawer-item .arrow { margin-left: auto; color: #0a66ff; transform: rotate(90deg); }

    /* 子菜单 */
    .drawer-sub-menu {
      margin-left: 28px; padding-left: 16px;
      border-left: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }
    .drawer-sub-item {
      padding: 10px 0; font-size: 14px; color: #666; cursor: pointer;
    }
    .drawer-sub-item.active { color: #0a66ff; font-weight: 500; }

    /* ======= 桌面端侧边栏 (保留原逻辑) ======= */
    .desktop-layout { display: none; }
    @media (min-width: 769px) {
      .mobile-topbar, .mobile-drawer, .mobile-overlay { display: none !important; }
      .desktop-layout { display: flex; height: 100vh; }
      .desktop-sidebar { width: 240px; background: #fff; border-right: 1px solid #eee; padding: 20px; }
      .desktop-main { flex: 1; padding: 30px; overflow-y: auto; background: #f4f6f8; }
    }

    /* 主要内容区样式 (简化展示，通用) */
    .main-content-page { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-bottom: 16px; }
    .page-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- ================= 移动端 ================= -->
  <div class="mobile-topbar">
    <div class="left">
      <div class="menu-btn" onclick="toggleDrawer()">☰</div>
      <span>个人资料</span>
    </div>
    <div class="avatar">👤</div>
  </div>

  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleDrawer()"></div>

  <div class="mobile-drawer" id="mobileDrawer">
    <div class="drawer-header">
      <div class="drawer-logo">
        <img src="assets/logo.png" alt="晴天支付">
        <div class="drawer-title">
          <h2>晴天支付</h2>
          <p>商户服务平台</p>
        </div>
      </div>
      <div class="drawer-close" onclick="toggleDrawer()">✕</div>
    </div>

    <div class="drawer-body">
      <div class="drawer-group-title">商户工作台</div>
      
      <div class="drawer-item">
        <div class="icon icon-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></div>
        用户中心
      </div>

      <div class="drawer-item active">
        <div class="icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
        个人资料
        <svg class="arrow" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </div>

      <div class="drawer-sub-menu">
        <div class="drawer-sub-item active">API信息</div>
        <div class="drawer-sub-item">修改资料</div>
      </div>

      <div class="drawer-group-title">交易与资金</div>
      
      <div class="drawer-item">
        <div class="icon icon-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
        订单记录
      </div>

      <div class="drawer-item">
        <div class="icon icon-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div>
        提现记录
      </div>

      <div class="drawer-item">
        <div class="icon icon-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg></div>
        资金明细
      </div>

      <div class="drawer-group-title">其他</div>

      <div class="drawer-item">
        <div class="icon icon-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div>
        聚合收款
      </div>

      <div class="drawer-item">
        <div class="icon icon-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
        开发文档
      </div>

      <div class="drawer-item">
        <div class="icon icon-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></div>
        联系客服
      </div>

    </div>
  </div>

  <!-- ================= 主内容区 ================= -->
  <div class="main-content-page" style="padding: 16px;">
    <div class="card">
      <div class="page-title">API 信息</div>
      <div style="color:#666; font-size:14px; margin-bottom: 10px;">接口地址</div>
      <input type="text" value="https://api.lynli.me/" readonly style="width:100%; padding:12px; border:1px solid #eee; border-radius:8px; background:#fafafa;">
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    // 移动端抽屉开关逻辑
    function toggleDrawer() {
      const drawer = document.getElementById('mobileDrawer');
      const overlay = document.getElementById('mobileOverlay');
      
      if (drawer.classList.contains('open')) {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      } else {
        drawer.classList.add('open');
        overlay.classList.add('show');
      }
    }
  </script>
</body>
</html>
