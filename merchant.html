<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商户控制台 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    /* ================= 基础重置与高级色彩系统 ================= */
    :root {
      --primary: #2563eb;      /* 品牌蓝 */
      --primary-light: #eff6ff;
      --bg: #f8fafc;           /* 高级浅灰背景 */
      --surface: #ffffff;      /* 卡片白 */
      --text-main: #0f172a;    /* 深色正文 */
      --text-muted: #64748b;   /* 弱化文本 */
      --border: #e2e8f0;       /* 边框色 */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-drawer: 10px 0 30px -5px rgba(0, 0, 0, 0.1), 4px 0 10px -4px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; background: var(--bg); color: var(--text-main); }
    a { text-decoration: none; color: inherit; }

    /* ================= 移动端顶栏 ================= */
    .mobile-topbar {
      display: none; align-items: center; justify-content: space-between;
      height: 64px; background: var(--surface); padding: 0 16px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 90;
    }
    .mobile-topbar .left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; }
    .menu-btn { font-size: 24px; cursor: pointer; padding: 8px; border-radius: 8px; transition: background 0.2s; }
    .menu-btn:active { background: var(--bg); }

    /* ================= 核心：高级毛玻璃遮罩 ================= */
    .drawer-mask {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.3); /* 深蓝偏黑半透明 */
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); /* 高级模糊 */
      z-index: 9998; opacity: 0; transition: opacity 0.4s ease;
    }
    .drawer-mask.show { display: block; opacity: 1; }

    /* ================= 核心：物理级丝滑抽屉 ================= */
    .drawer {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 85%; max-width: 320px;
      background: var(--surface);
      z-index: 9999;
      display: flex; flex-direction: column;
      border-radius: 0 24px 24px 0;
      box-shadow: var(--shadow-drawer);
      /* 重点：带轻微回弹的贝塞尔曲线，触发 GPU 加速 */
      transform: translateX(-100%);
      will-change: transform;
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .drawer.open { transform: translateX(0); }

    /* 抽屉头部 */
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 20px 20px; border-bottom: 1px solid transparent;
    }
    .drawer-logo-area { display: flex; align-items: center; gap: 14px; }
    .drawer-logo-area img { width: 48px; height: 48px; border-radius: 14px; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
    .drawer-title h2 { margin: 0; font-size: 19px; color: var(--text-main); font-weight: 700; letter-spacing: -0.5px; }
    .drawer-title p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }
    .drawer-close { 
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    }
    .drawer-close:active { transform: scale(0.9); }

    /* 抽屉内容区 */
    .drawer-body { flex: 1; overflow-y: auto; padding: 8px 16px 24px; scrollbar-width: none; }
    .drawer-body::-webkit-scrollbar { display: none; }
    
    /* 分组标题 */
    .drawer-group { font-size: 12px; color: #94a3b8; margin: 24px 12px 8px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

    /* 卡片式菜单项 */
    .drawer-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px; margin-bottom: 4px;
      border-radius: 14px; font-size: 15px; color: #334155; font-weight: 500;
      transition: all 0.2s ease;
    }
    .drawer-item:active { background: var(--bg); transform: scale(0.98); }
    .drawer-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    
    /* 精致的图标容器 */
    .icon-box { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .icon-box svg { width: 20px; height: 20px; }
    
    .icon-blue { background: #eff6ff; color: #2563eb; }
    .drawer-item.active .icon-blue { background: #2563eb; color: #fff; }
    
    .icon-purple { background: #f5f3ff; color: #7c3aed; }
    .icon-green { background: #ecfdf5; color: #059669; }

    /* 子菜单 */
    .drawer-sub-menu {
      margin-left: 34px; padding-left: 16px;
      border-left: 1.5px solid var(--border);
      margin-bottom: 8px; display: none;
    }
    .drawer-sub-item { padding: 12px 0; font-size: 14px; color: var(--text-muted); font-weight: 500; transition: color 0.2s; }
    .drawer-sub-item.active { color: var(--primary); font-weight: 600; }

    /* ================= 后台主界面 (数据看板) ================= */
    .main-dashboard { padding: 24px 20px; max-width: 800px; margin: 0 auto; }
    .dashboard-header { margin-bottom: 24px; }
    .dashboard-header h1 { font-size: 24px; margin-bottom: 4px; font-weight: 700; }
    .dashboard-header p { color: var(--text-muted); font-size: 14px; }

    /* 数据卡片网格 */
    .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
    .metric-card { background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); position: relative; overflow: hidden; }
    .metric-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    .metric-value { font-size: 26px; font-weight: 700; color: var(--text-main); display: flex; align-items: baseline; gap: 4px; letter-spacing: -1px; }
    .metric-value span { font-size: 14px; font-weight: 500; color: var(--text-muted); }
    
    /* 趋势图占位 */
    .chart-card { background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
    .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 20px; }
    .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 100px; gap: 8px; }
    .bar-col { flex: 1; background: var(--primary-light); border-radius: 4px; position: relative; height: 10%; transition: height 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar-col.active { background: var(--primary); }

    /* 响应式 */
    @media (min-width: 769px) {
      .mobile-topbar { display: none; }
      .drawer, .drawer-mask { display: none !important; }
      .main-dashboard { padding: 40px; }
      .metrics-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 768px) {
      .mobile-topbar { display: flex; }
    }
  </style>
</head>
<body>

  <!-- ================= 移动端顶栏 ================= -->
  <div class="mobile-topbar">
    <div class="left">
      <div class="menu-btn" onclick="toggleDrawer(true)">☰</div>
      <span>Dashboard</span>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; color: #2563eb; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">👤</div>
  </div>

  <!-- ================= 遮罩 ================= -->
  <div class="drawer-mask" id="drawerMask" onclick="toggleDrawer(false)"></div>

  <!-- ================= 丝滑抽屉 ================= -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-logo-area">
        <img src="assets/logo.png" alt="晴天支付">
        <div class="drawer-title">
          <h2>晴天支付</h2>
          <p>商户服务平台</p>
        </div>
      </div>
      <div class="drawer-close" onclick="toggleDrawer(false)">✕</div>
    </div>

    <div class="drawer-body">
      <div class="drawer-group">商户工作台</div>
      
      <a href="#" class="drawer-item">
        <div class="icon-box icon-blue">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        </div>
        数据看板
      </a>

      <div class="drawer-item active" onclick="toggleSubMenu(this)">
        <div class="icon-box icon-blue">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        个人资料
        <svg style="margin-left: auto; width: 16px; height: 16px; transition: transform 0.3s;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </div>

      <div class="drawer-sub-menu" style="display: block;">
        <div class="drawer-sub-item active">API信息</div>
        <div class="drawer-sub-item">修改资料</div>
      </div>

      <div class="drawer-group">交易与资金</div>
      
      <a href="#" class="drawer-item">
        <div class="icon-box icon-purple">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        订单记录
      </a>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-purple">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        </div>
        提现记录
      </a>

      <div class="drawer-group">其他</div>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        </div>
        聚合收款
      </a>

      <a href="#" class="drawer-item">
        <div class="icon-box icon-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        开发文档
      </a>
    </div>
  </div>

  <!-- ================= 真正的主看板内容 ================= -->
  <div class="main-dashboard">
    <div class="dashboard-header">
      <h1>数据看板</h1>
      <p>欢迎回来，您的账户状态正常。</p>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">可提现余额 (CNY)</div>
        <div class="metric-value">0.00 <span>元</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-title">今日收入 (已扣费)</div>
        <div class="metric-value" style="color: #059669;">+0.00 <span>元</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-title">今日订单数</div>
        <div class="metric-value">0 <span>笔</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-title">通道成功率</div>
        <div class="metric-value">100 <span>%</span></div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">近 7 天收入走势</div>
      <div class="chart-bars">
        <div class="bar-col" style="height: 20%;"></div>
        <div class="bar-col" style="height: 40%;"></div>
        <div class="bar-col" style="height: 15%;"></div>
        <div class="bar-col" style="height: 60%;"></div>
        <div class="bar-col" style="height: 30%;"></div>
        <div class="bar-col" style="height: 80%;"></div>
        <div class="bar-col active" style="height: 100%;"></div>
      </div>
    </div>
  </div>

  <script>
    // 丝滑开关抽屉 (带物理回弹)
    function toggleDrawer(show) {
      const drawer = document.getElementById('drawer');
      const mask = document.getElementById('drawerMask');
      
      if (show) {
        mask.style.display = 'block';
        void mask.offsetWidth; 
        mask.classList.add('show');
        drawer.classList.add('open');
        document.body.style.overflow = 'hidden';
      } else {
        mask.classList.remove('show');
        drawer.classList.remove('open');
        document.body.style.overflow = 'auto';
        setTimeout(() => {
          if (!drawer.classList.contains('open')) {
            mask.style.display = 'none';
          }
        }, 400);
      }
    }

    // 子菜单折叠
    function toggleSubMenu(el) {
      const subMenu = el.nextElementSibling;
      const arrow = el.querySelector('svg[style*="transition"]');
      if (subMenu.style.display === 'block') {
        subMenu.style.display = 'none';
        if(arrow) arrow.style.transform = 'rotate(0deg)';
      } else {
        subMenu.style.display = 'block';
        if(arrow) arrow.style.transform = 'rotate(180deg)';
      }
    }
  </script>
</body>
</html>
