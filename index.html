<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>晴天支付 - 多商户聚合支付平台</title>
  <style>
    /* ===== 基础重置 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f4f6f8; color: #111; }
    a { text-decoration: none; }

    /* ===== 顶部导航 ===== */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; }
    .logo h1 { font-size: 18px; margin: 0; font-weight: bold; }
    .desktop-nav { display: flex; gap: 24px; align-items: center; }
    .desktop-nav a { color: #666; font-size: 14px; font-weight: 500; }
    .desktop-nav a.active { color: #0a66ff; }
    .hamburger { display: none; font-size: 24px; cursor: pointer; padding: 5px; }

    /* ===== 页面主内容 ===== */
    .main-content { text-align: center; padding: 60px 20px; max-width: 800px; margin: 0 auto; }
    .main-content h1 { font-size: 42px; line-height: 1.2; margin-bottom: 20px; font-weight: 800; }
    .main-content h1 span { color: #0a66ff; }
    .main-content p { color: #666; font-size: 16px; line-height: 1.6; }

    /* ========================================================
       终极侧滑抽屉 (完全独立，绝对防叠字)
       ======================================================== */
    
    /* 黑色半透明遮罩 */
    .drawer-mask {
      display: none; position: fixed !important; inset: 0 !important;
      background: rgba(0, 0, 0, 0.4) !important;
      backdrop-filter: blur(3px) !important;
      z-index: 99998 !important;
    }

    /* 左侧抽屉主体 */
    .drawer {
      position: fixed !important; top: 0 !important; bottom: 0 !important;
      left: -100% !important; /* 默认藏在左边 */
      width: 80% !important; max-width: 320px !important;
      background: #ffffff !important;
      z-index: 99999 !important;
      display: flex !important; flex-direction: column !important;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 4px 0 24px rgba(0,0,0,0.1) !important;
      border-radius: 0 16px 16px 0 !important;
    }
    .drawer.open { left: 0 !important; }

    /* 抽屉头部 */
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px; border-bottom: 1px solid #f5f5f5;
    }
    .drawer-logo-area { display: flex; align-items: center; gap: 12px; }
    .drawer-logo-area img { width: 42px; height: 42px; border-radius: 12px; }
    .drawer-title h2 { margin: 0; font-size: 18px; color: #111; }
    .drawer-title p { margin: 2px 0 0 0; font-size: 12px; color: #888; }
    .drawer-close { font-size: 24px; color: #999; cursor: pointer; padding: 5px; }

    /* 抽屉内容区 */
    .drawer-body { flex: 1; overflow-y: auto; padding: 10px 16px 20px; }
    .drawer-group { font-size: 12px; color: #999; margin: 16px 8px 8px; }

    /* 菜单项 */
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; margin-bottom: 4px;
      border-radius: 12px; font-size: 15px; color: #333;
    }
    .drawer-item.active { background: #f0f7ff; color: #0a66ff; font-weight: 600; }
    
    /* 图标背景色 */
    .icon-box { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .icon-box svg { width: 18px; height: 18px; }
    .icon-blue { background: #eef3ff; color: #0a66ff; }
    .icon-purple { background: #f4ebff; color: #9333ea; }
    .icon-green { background: #e6f7f0; color: #059669; }

    /* 手机端响应 */
    @media (max-width: 768px) {
      .desktop-nav { display: none; }
      .hamburger { display: block; }
      .main-content h1 { font-size: 34px; }
    }
  </style>
</head>
<body>

  <!-- 顶部 -->
  <div class="header">
    <div class="logo">
      <img src="assets/logo.png" alt="logo">
      <h1>晴天支付</h1>
    </div>
    <div class="desktop-nav">
      <a href="index.html" class="active">首页</a>
      <a href="docs.html">开发者文档</a>
      <a href="merchant.html">商户中心</a>
      <a href="support.html">帮助支持</a>
    </div>
    <div class="hamburger" onclick="openDrawer()">☰</div>
  </div>

  <!-- 遮罩层 -->
  <div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>

  <!-- 抽屉层 -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-logo-area">
        <img src="assets/logo.png" alt="晴天支付">
        <div class="drawer-title">
          <h2>晴天支付</h2>
          <p>商户服务平台</p>
        </div>
      </div>
      <div class="drawer-close" onclick="closeDrawer()">✕</div>
    </div>

    <div class="drawer-body">
      <div class="drawer-group">导航菜单</div>
      
      <a href="index.html" class="drawer-item active">
        <div class="icon-box icon-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></div>
        首页
      </a>

      <a href="docs.html" class="drawer-item">
        <div class="icon-box icon-purple"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
        开发者文档
      </a>

      <a href="merchant.html" class="drawer-item">
        <div class="icon-box icon-blue"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
        商户中心
      </a>

      <a href="support.html" class="drawer-item">
        <div class="icon-box icon-green"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></div>
        帮助支持
      </a>

      <div style="margin-top: 20px;">
        <a href="login.html" style="display: block; text-align: center; background: #0a66ff; color: #fff; padding: 14px; border-radius: 8px; font-weight: bold;">商户入驻</a>
      </div>
    </div>
  </div>

  <!-- 页面内容 -->
  <div class="main-content">
    <h1>一笔资金，<br><span>晴天直达</span></h1>
    <p>多商户聚合支付平台：复用统一用户体系，审批即得专属支付标识。<br>支持支付宝双通道收款，秒级到账、在线提现。</p>
  </div>

  <script>
    // 绝对独立控制抽屉滑出
    function openDrawer() {
      document.getElementById('drawerMask').style.display = 'block';
      document.getElementById('drawer').classList.add('open');
      document.body.style.overflow = 'hidden'; // 防止底层滚动
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawerMask').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
  </script>
</body>
</html>
