<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>晴天支付 - 多商户聚合支付平台</title>
  <style>
    /* ===== 彻底重置 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f4f6f8; color: #111; }
    a { text-decoration: none; }

    /* ===== 顶部导航 ===== */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; }
    .logo h1 { font-size: 18px; margin: 0; font-weight: bold; }
    
    .desktop-nav { display: flex; gap: 24px; align-items: center; }
    .desktop-nav a { color: #666; font-size: 14px; font-weight: 500; }
    .desktop-nav a.active { color: #0a66ff; }
    .desktop-nav .btn { background: #111; color: #fff; padding: 8px 16px; border-radius: 8px; }

    .hamburger { display: none; font-size: 24px; cursor: pointer; }

    /* ===== 页面主内容 ===== */
    .main-content { text-align: center; padding: 60px 20px; max-width: 800px; margin: 0 auto; }
    .main-content h1 { font-size: 42px; line-height: 1.2; margin-bottom: 20px; font-weight: 800; }
    .main-content h1 span { color: #0a66ff; }
    .main-content p { color: #666; font-size: 16px; line-height: 1.6; }

    /* ===== 终极方案：独立全屏菜单 ===== */
    .mobile-menu {
      display: none; /* 默认隐藏 */
      position: fixed !important; 
      top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100vw !important; height: 100vh !important;
      background: #ffffff !important; /* 纯白，绝对不透明 */
      z-index: 999999 !important; /* 最高层级 */
      flex-direction: column;
      padding: 20px;
    }
    
    /* 菜单头部 */
    .mobile-menu-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
    .mobile-menu-close { font-size: 28px; cursor: pointer; color: #333; padding: 5px; }
    
    /* 菜单项 */
    .mobile-menu a {
      display: block;
      padding: 20px 0;
      font-size: 18px;
      color: #333;
      font-weight: 500;
      border-bottom: 1px solid #f5f5f5;
    }

    /* 手机端响应 */
    @media (max-width: 768px) {
      .desktop-nav { display: none; }
      .hamburger { display: block; }
      .main-content h1 { font-size: 34px; }
    }
  </style>
</head>
<body>

  <!-- 顶部 -->
  <div class="header">
    <div class="logo">
      <img src="assets/logo.png" alt="logo">
      <h1>晴天支付</h1>
    </div>
    
    <div class="desktop-nav">
      <a href="index.html" class="active">首页</a>
      <a href="docs.html">开发者文档</a>
      <a href="merchant.html">商户中心</a>
      <a href="support.html">帮助支持</a>
      <a href="login.html" class="btn">商户入驻</a>
    </div>

    <div class="hamburger" onclick="openMenu()">☰</div>
  </div>

  <!-- 全屏独立菜单 (不在 header 里面，绝对覆盖) -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
      <h1 style="font-size: 18px; margin:0;">导航菜单</h1>
      <div class="mobile-menu-close" onclick="closeMenu()">✕</div>
    </div>
    <a href="index.html">首页</a>
    <a href="docs.html">开发者文档</a>
    <a href="merchant.html">商户中心</a>
    <a href="support.html">帮助支持</a>
    <a href="login.html" style="color: #0a66ff; border-bottom: none;">商户入驻 →</a>
  </div>

  <!-- 内容 -->
  <div class="main-content">
    <h1>一笔资金，<br><span>晴天直达</span></h1>
    <p>多商户聚合支付平台：复用统一用户体系，审批即得专属支付标识。<br>支持支付宝双通道收款，秒级到账、在线提现。</p>
  </div>

  <script>
    // 暴力切换 display 属性
    function openMenu() {
      document.getElementById('mobileMenu').style.display = 'flex';
      document.body.style.overflow = 'hidden'; // 禁止底层页面滚动
    }
    function closeMenu() {
      document.getElementById('mobileMenu').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
  </script>
</body>
</html>
