<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晴天支付 - 多商户聚合支付平台</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">支</div>
      <div class="logo-text"><h1>晴天支付</h1><p>QingTian Pay</p></div>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="index.html" class="active">首页</a>
      <a href="docs.html">开发者文档</a>
      <a href="merchant.html">商户中心</a>
      <a href="support.html">帮助支持</a>
    </div>
    <a href="login.html" class="btn-header">商户入驻</a>
    <div class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('mobile-show')">☰</div>
  </div>
  <main style="max-width: 900px; margin: 0 auto; padding: 30px 20px;">
    <div style="text-align: center; margin-top: 40px;">
      <div style="display: inline-block; background: #eef3ff; color: #0a66ff; padding: 6px 16px; border-radius: 20px; font-size: 13px; margin-bottom: 20px;">
        ☀️ 晴天支付 · 与 Lynli 生态同源统一账号
      </div>
      <h1 style="font-size: 36px; line-height: 1.2; margin-bottom: 20px; color: #111;">
        <span style="display: block;">一笔资金，</span>
        <span style="display: block; color: #0a66ff;">晴天直达</span>
      </h1>
      <p style="color: #666; font-size: 15px; max-width: 600px; margin: 0 auto 40px; line-height: 1.6;">
        多商户聚合支付平台：复用 Lynli 统一用户体系，审批即得专属支付标识 app_id / app_secret。<br>
        支付宝、USDT 双通道收款，固定 10% 费率，余额秒级到账、在线提现。
      </p>
    </div>
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <h3 style="margin-bottom: 20px; font-size: 16px;">查询订单状态</h3>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="queryOrder" placeholder="输入商户订单号查询" style="flex: 1;">
        <button class="btn-primary" style="white-space: nowrap;" onclick="toast('查询功能开发中')">查询</button>
      </div>
    </div>
  </main>
  <script src="assets/api.js"></script>
</body>
</html>
