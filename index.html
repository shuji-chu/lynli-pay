<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>晴天支付 - 多商户聚合支付平台</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css?v=99">
  <style>
    /* 强制内联覆盖，无视任何外部 css 干扰 */
    body { background: #f4f6f8; font-family: -apple-system, sans-serif; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000;}
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; }
    .logo-text h1 { margin: 0; font-size: 18px; color: #111; }
    .menu-toggle { font-size: 24px; cursor: pointer; color: #111; display: none; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { text-decoration: none; color: #666; font-size: 14px; font-weight: 500; }
    .nav-links a.active { color: #0a66ff; }
    .btn-header { background: #111; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; }

    /* 页面主内容 */
    .main { max-width: 900px; margin: 0 auto; padding: 30px 20px; text-align: center; }
    .main h1 { font-size: 40px; line-height: 1.2; margin-bottom: 20px; color: #111; }
    .main h1 span { color: #0a66ff; }
    .main p { color: #666; font-size: 16px; line-height: 1.6; }

    /* 手机端极简全屏菜单 */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .btn-header { display: none; }
      .menu-toggle { display: block; }
      
      .nav-links.mobile-show {
        display: flex !important;
        flex-direction: column !important;
        position: fixed !important;
        top: 61px !important; 
        left: 0 !important; 
        right: 0 !important; 
        bottom: 0 !important;
        background: #ffffff !important;
        z-index: 9999 !important;
        padding: 20px !important;
        margin: 0 !important;
      }
      .nav-links.mobile-show a {
        display: block !important;
        width: 100% !important;
        font-size: 18px !important;
        padding: 16px 0 !important;
        border-bottom: 1px solid #eee !important;
        text-align: left !important;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="assets/logo.png" alt="晴天支付">
      <div class="logo-text"><h1>晴天支付</h1></div>
    </div>
    
    <div class="nav-links" id="navLinks">
      <a href="index.html" class="active">首页</a>
      <a href="docs.html">开发者文档</a>
      <a href="merchant.html">商户中心</a>
      <a href="support.html">帮助支持</a>
    </div>
    
    <a href="login.html" class="btn-header">商户入驻</a>
    <div class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('mobile-show')">☰</div>
  </div>

  <div class="main">
    <h1>一笔资金，<br><span>晴天直达</span></h1>
    <p>多商户聚合支付平台：复用统一用户体系，审批即得专属支付标识。<br>支持支付宝双通道收款，秒级到账、在线提现。</p>
  </div>
</body>
</html>
