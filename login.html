<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商户登录 - 晴天支付</title>
  <link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="assets/style.css">
  <style>
    body { background: #f0f4f8; display: flex; flex-direction: column; min-height: 100vh; }
    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: 100%; max-width: 440px; background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); }
    .tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 32px; }
    .tab { flex: 1; text-align: center; padding: 16px; cursor: pointer; font-size: 16px; color: var(--text-muted); transition: all 0.2s; }
    .tab.active { color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><img src="assets/logo.png" alt="晴天支付"><div class="logo-text"><h1>晴天支付</h1></div></div>
    <div class="nav-links" id="navLinks"><a href="index.html">首页</a><a href="docs.html">开发者文档</a><a href="merchant.html">商户中心</a><a href="support.html">帮助支持</a></div>
    <a href="login.html" class="btn-header" style="display:none;">商户入驻</a>
    <div class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('mobile-show')">☰</div>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="tabs">
        <div id="tab-login" class="tab active" onclick="switchTab('login')">账号登录</div>
        <div id="tab-reg" class="tab" onclick="switchTab('reg')">商户入驻</div>
      </div>
      <div class="form-group"><label>邮箱地址</label><input type="email" id="email" placeholder="you@example.com"></div>
      <div class="form-group"><label>登录密码</label><input type="password" id="password" placeholder="至少 6 位密码"></div>
      <div id="code-group" class="form-group" style="display: none;">
        <label>邮箱验证码</label>
        <div style="display: flex; gap: 12px;">
          <input type="text" id="code" placeholder="6位验证码" style="flex:1;">
          <button id="btn-send" onclick="sendCode()" class="btn-outline" style="padding: 0 20px; white-space: nowrap;">获取验证码</button>
        </div>
      </div>
      <button id="btn-submit" onclick="submitAuth()" class="btn-primary" style="width: 100%; margin-top: 12px; padding: 14px;">立即登录</button>
    </div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    let isLogin = true;
    function switchTab(type) {
      isLogin = (type === 'login');
      document.getElementById('tab-login').className = isLogin ? 'tab active' : 'tab';
      document.getElementById('tab-reg').className = !isLogin ? 'tab active' : 'tab';
      document.getElementById('code-group').style.display = isLogin ? 'none' : 'block';
      document.getElementById('btn-submit').textContent = isLogin ? '立即登录' : '注册并入驻';
    }
    let timer = null;
    async function sendCode() {
      const email = document.getElementById('email').value.trim();
      if (!email) return toast('请输入邮箱', true);
      const btn = document.getElementById('btn-send');
      btn.disabled = true; btn.textContent = '发送中...';
      try {
        await apiFetch('/passport/auth/send-code', { email });
        toast('验证码已发送');
        let sec = 60;
        btn.textContent = sec + 's 后重试';
        timer = setInterval(() => {
          sec--;
          if (sec <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; } 
          else { btn.textContent = sec + 's 后重试'; }
        }, 1000);
      } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = '获取验证码'; }
    }
    async function submitAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const code = document.getElementById('code').value.trim();
      if (!email || !password) return toast('请填写邮箱和密码', true);
      if (!isLogin && !code) return toast('请填写验证码', true);
      const btn = document.getElementById('btn-submit');
      btn.disabled = true; btn.textContent = '处理中...';
      try {
        if (!isLogin) {
          await apiFetch('/passport/auth/register', { email, password, code });
          toast('注册成功，正在登录...');
        }
        const res = await apiFetch('/passport/auth/login', { email, password });
        const token = res.data ? res.data.token : res.token;
        setToken(token);
        toast('登录成功');
        setTimeout(() => window.location.href = 'merchant.html', 800);
      } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = isLogin ? '立即登录' : '注册并入驻'; }
    }
  </script>
</body>
</html>
